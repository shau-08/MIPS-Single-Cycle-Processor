name: mips-regression
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y iverilog verilator
      - run: pip install cocotb cocotb-coverage pyuvm pyyaml
      - name: Lint RTL
        run: verilator --lint-only -Wall -Wno-DECLFILENAME -Wno-UNUSEDSIGNAL --top-module mips_top rtl/*.v
      - name: Multi-seed pyuvm regression (fails on any mismatch)
        run: cd verif && python3 run_regression.py --seeds 8 --n 400
      - name: Mutation test
        run: cd verif && python3 mutation.py 100 1
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: reports, path: "verif/*.txt" }
